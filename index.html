<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichário de Inglês</title>
<meta name="description" content="Treino das palavras das suas aulas de inglês, com índice de reforço, áudio e prática com IA.">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1320" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichário">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#EDF0F5; --card:#FFFFFF; --card-2:#F5F7FB;
  --ink:#172136; --ink-2:#4A5570; --ink-3:#737E94;
  --rule:#DDE4EF; --rule-2:#C4CFE0;
  --pen:#1F4BB8; --pen-ink:#FFFFFF; --pen-soft:#E4EAFA;
  --red:#C93C34; --red-soft:#FBE8E6;
  --hl:#FFE14D; --hl-ink:#172136;
  --ok:#1C8454; --ok-soft:#E0F2E9;
  --b-new:#A3ABBB; --b-weak:#C93C34; --b-learn:#D2830C; --b-near:#2B78BE; --b-done:#1C8454;
  --shadow:0 1px 0 rgba(23,33,54,.04), 0 10px 26px -16px rgba(23,33,54,.30);
  --radius:12px;
  --f-display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1320; --card:#161D2D; --card-2:#1B2337;
    --ink:#E7ECF5; --ink-2:#AAB4C7; --ink-3:#808BA1;
    --rule:#243049; --rule-2:#34415E;
    --pen:#8FA9FF; --pen-ink:#0C1120; --pen-soft:#1D2848;
    --red:#F0746C; --red-soft:#3A1F25;
    --hl:#E8C94A; --hl-ink:#16140A;
    --ok:#46C08B; --ok-soft:#163226;
    --b-new:#66718A; --b-weak:#F0746C; --b-learn:#F0AA3E; --b-near:#63A9EA; --b-done:#46C08B;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1320; --card:#161D2D; --card-2:#1B2337;
  --ink:#E7ECF5; --ink-2:#AAB4C7; --ink-3:#808BA1;
  --rule:#243049; --rule-2:#34415E;
  --pen:#8FA9FF; --pen-ink:#0C1120; --pen-soft:#1D2848;
  --red:#F0746C; --red-soft:#3A1F25;
  --hl:#E8C94A; --hl-ink:#16140A;
  --ok:#46C08B; --ok-soft:#163226;
  --b-new:#66718A; --b-weak:#F0746C; --b-learn:#F0AA3E; --b-near:#63A9EA; --b-done:#46C08B;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:30px;line-height:1.1;font-weight:700}
h2{font-size:22px;line-height:1.2;font-weight:600}
h3{font-size:19px;line-height:1.25;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pen)}
svg{flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 11.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.meta{color:var(--ink-2);font-size:14.5px}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
mark.hl,mark.tw{color:var(--hl-ink);background:linear-gradient(transparent 10%,var(--hl) 10%,var(--hl) 90%,transparent 90%);padding:0 .12em;border-radius:2px}
mark.tw{cursor:pointer;font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:4px 0;text-align:left}
.brand-name{display:flex;flex-direction:column;line-height:1}
.brand-name b{font:700 22px/1 var(--f-display);letter-spacing:-.01em}
.brand-name small{font:600 10.5px/1.2 var(--f-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.logo .c{fill:var(--card);stroke:var(--ink)}
.logo .r{stroke:var(--red)}
.logo .l{stroke:var(--rule-2)}
.topnav{display:none;margin-left:auto;gap:2px}
.top-actions{display:flex;align-items:center;gap:4px;margin-left:auto}
.sync{font:600 11px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;padding:6px 8px;border-radius:999px}
.sync.err{color:var(--red);background:var(--red-soft)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--ink-3);font:700 11.5px/1.1 var(--f-body);padding:6px 2px;border-radius:10px;min-height:52px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--pen)}
.topnav .tab{flex-direction:row;gap:8px;font-size:14.5px;min-height:40px;padding:0 12px}
.topnav .tab svg{width:20px;height:20px}
.topnav .tab[aria-current="page"]{background:var(--pen-soft)}
.view{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px calc(92px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .topnav{display:flex}
  .top-actions{margin-left:8px}
  .tabbar{display:none}
  .view{padding-block:28px 56px}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--rule-2);background:var(--card);color:var(--ink);font:700 15px/1.2 var(--f-body);text-decoration:none;text-align:center;max-width:100%}
.btn:hover{border-color:var(--pen)}
.btn svg{width:20px;height:20px}
.btn.small svg{width:18px;height:18px}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{min-height:54px;font-size:17px;padding:0 24px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--card-2)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--rule-2))}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--card-2);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.say{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--rule-2);background:var(--card);color:var(--pen);vertical-align:middle}
.say:hover{border-color:var(--pen)}
.say svg{width:20px;height:20px}
.say.sm{width:32px;height:32px}
.say.sm svg{width:16px;height:16px}
:is(button,a,input,select,textarea,summary):focus-visible{outline:3px solid color-mix(in srgb,var(--pen) 60%,transparent);outline-offset:2px}
.field{width:100%;min-height:50px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--rule-2);background:var(--card);color:var(--ink);font:600 18px/1.3 var(--f-body)}
.field:focus{border-color:var(--pen);outline:none}
.field.sm{min-height:42px;font-size:16px;font-weight:400;padding:8px 12px}
textarea.field{min-height:92px;resize:vertical;font-weight:400;font-size:17px;line-height:1.45}
select.field{font-weight:600;font-size:16px;appearance:auto}
.fgroup{display:grid;gap:6px}
.fgroup > span{font:700 14px/1.2 var(--f-body);color:var(--ink-2)}
.check{display:flex;align-items:center;gap:10px;font-size:15.5px;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--pen)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rule-2);background:var(--card);font:700 14px/1 var(--f-body);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--rule-2);background:var(--card);color:var(--ink);font:600 15px/1.2 var(--f-display);text-decoration:none}
.chip:hover{border-color:var(--pen)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--b-new);flex:none}
.dot.weak{background:var(--b-weak)} .dot.learn{background:var(--b-learn)} .dot.near{background:var(--b-near)} .dot.done{background:var(--b-done)}
.meter{display:inline-flex;gap:2px;align-items:center;color:var(--b-new)}
.meter i{display:block;width:5px;height:13px;border-radius:2px;background:var(--rule-2)}
.meter i.on{background:currentColor}
.meter.weak{color:var(--b-weak)} .meter.learn{color:var(--b-learn)} .meter.near{color:var(--b-near)} .meter.done{color:var(--b-done)}
.pct{font:600 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:3.2ch;text-align:right}
.band-pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.linkish{background:none;border:0;padding:0;color:var(--pen);font:700 14.5px/1.3 var(--f-body);text-decoration:underline;text-underline-offset:3px;text-align:left}

/* ---------- panels & home ---------- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.home{display:grid;gap:16px}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
@media (min-width:960px){.home{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}}
.hello{display:grid;gap:4px;padding:2px 2px 4px}
.index-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font:700 64px/0.95 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:30px;margin-left:2px;color:var(--ink-2)}
.distbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--rule);gap:2px}
.distbar span{display:block;height:100%;min-width:3px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:6px}
.legend b{font:600 14px/1 var(--f-mono);color:var(--ink)}
.cta{background:var(--pen-soft);border-color:color-mix(in srgb,var(--pen) 25%,var(--rule))}
.cta-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cta-row > div{display:grid;gap:4px;min-width:0}
.more-train{display:grid;gap:8px}
.lesson-tag{display:inline-block;font:600 11.5px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:5px;padding:4px 6px;white-space:nowrap}
.linklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.linkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--rule-2);border-radius:10px;min-width:0}
.linkrow a{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.linkrow.done a{color:var(--ink-3);text-decoration:line-through}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.strip span{aspect-ratio:1;border-radius:4px;background:var(--rule);max-width:100%}
.strip span.l1{background:color-mix(in srgb,var(--pen) 35%,var(--rule))}
.strip span.l2{background:color-mix(in srgb,var(--pen) 65%,var(--rule))}
.strip span.l3{background:var(--pen)}
.strip span.today{outline:2px solid var(--ink);outline-offset:1px}
.streak{font:700 34px/1 var(--f-display)}
.streak small{font:400 16px/1.2 var(--f-body);color:var(--ink-2);margin-left:6px}
.mini-list{list-style:none;margin:0;padding:0;display:grid}
.mini-list li+li{border-top:1px solid var(--rule)}
.mini-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;background:none;border:0;text-align:left;color:var(--ink)}
.mini-row .w{flex:1;min-width:0;font:600 17px/1.2 var(--f-display);overflow-wrap:anywhere}
.mini-row .w small{display:block;font:400 14px/1.3 var(--f-body);color:var(--ink-2);margin-top:2px}
.empty{display:grid;gap:14px;justify-items:start;max-width:560px;padding:28px 4px}
.notice{border:1px solid var(--rule-2);background:var(--card-2);border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--ink-2)}
.notice.warn{border-color:color-mix(in srgb,var(--b-learn) 50%,var(--rule-2))}

/* ---------- lists ---------- */
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.screen-head > div{display:grid;gap:4px}
.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
@media (min-width:700px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}
.wordlist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.wordlist li+li{border-top:1px solid var(--rule)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:12px 14px;background:none;border:0;text-align:left;color:var(--ink);align-items:center}
.wrow:hover{background:var(--card-2)}
.w-en{font:600 18px/1.25 var(--f-display);overflow-wrap:anywhere}
.w-pt{grid-column:1;color:var(--ink-2);font-size:15px;overflow-wrap:anywhere}
.w-side{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:8px}
.w-concept{font:600 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--pen);margin-left:6px;vertical-align:2px}
.lessons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);text-align:left;color:var(--ink)}
.lrow:hover{border-color:var(--pen)}
.lnum{grid-row:1 / span 2;font:700 30px/1 var(--f-display);min-width:2.2ch;color:var(--pen)}
.lrow .t{font:600 17px/1.2 var(--f-display)}
.lrow .s{font-size:14px;color:var(--ink-2)}
.lrow .r{grid-column:3;grid-row:1 / span 2;display:flex;align-items:center;gap:8px}
.textblock{border-left:3px solid var(--red);padding:4px 0 4px 14px;display:grid;gap:4px;font-size:16.5px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
details.raw summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
details.raw pre{white-space:pre-wrap;font:14px/1.5 var(--f-mono);background:var(--card-2);border-radius:10px;padding:12px;margin:10px 0 0;overflow-x:auto}

/* ---------- practice ---------- */
.layer{position:fixed;inset:0;z-index:50;background:var(--ground);display:flex;flex-direction:column}
.pr-top{padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px}
.pr-top-in{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.pr-bar{flex:1;height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.pr-bar span{display:block;height:100%;background:var(--pen);border-radius:4px;transition:width .35s ease}
.pr-count{font:600 13px/1 var(--f-mono);color:var(--ink-2);min-width:5ch;text-align:right}
.pr-scroll{flex:1;overflow-y:auto;padding:6px 16px 18px;-webkit-overflow-scrolling:touch}
.pr-inner{max-width:600px;margin:0 auto;display:grid;gap:14px}
.icard{background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.icard-head{padding:16px 18px 14px;border-bottom:2px solid var(--red);display:grid;gap:8px}
.icard-body{padding:16px 18px 18px;display:grid;gap:14px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-position:0 15px}
.ex-label{font:600 11.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pen)}
.ex-word{font:700 clamp(32px,8.5vw,46px)/1.08 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.ex-mean{font:600 clamp(22px,5.8vw,30px)/1.2 var(--f-display);overflow-wrap:anywhere}
.ex-sent{font:500 clamp(20px,5.2vw,25px)/1.35 var(--f-display);overflow-wrap:anywhere}
.ex-sent .blank{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--pen);color:var(--pen);text-align:center;line-height:1.1}
.ex-sub{color:var(--ink-2);font-size:15.5px}
.ex-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pron{font:600 14px/1.3 var(--f-mono);color:var(--ink-2)}
.pron b{color:var(--red);font-weight:600}
.note{font-size:15px;color:var(--ink-2);background:var(--card-2);border-radius:8px;padding:8px 10px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--rule-2);background:var(--card);color:var(--ink);font:600 17.5px/1.3 var(--f-body);text-align:left}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt kbd{font:600 12px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--rule-2);border-radius:5px;padding:4px 6px;background:var(--card-2)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);text-decoration:line-through;text-decoration-color:var(--red)}
.opt:disabled{cursor:default}
.play-row{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0}
.play{width:88px;height:88px;border-radius:50%;background:var(--pen);color:var(--pen-ink);border:0;display:grid;place-items:center;box-shadow:0 8px 22px -10px var(--pen)}
.play svg{width:38px;height:38px}
.hint{font:600 18px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--ink-2)}
.fb{border-radius:10px;padding:14px 16px;border:1.5px solid var(--rule-2);background:var(--card);display:grid;gap:8px}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--red);background:var(--red-soft)}
.fb.almost{border-color:var(--b-learn);background:color-mix(in srgb,var(--b-learn) 12%,var(--card))}
.fb-title{font:700 20px/1.2 var(--f-display)}
.fb-ans{font-size:17px}
.fb-ans b{font-family:var(--f-display);font-size:19px}
.fb-meter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.fb-meter .arrow{font:600 14px/1 var(--f-mono);color:var(--ink)}
.diff .w-ok{color:var(--ok);font-weight:700}
.diff .w-miss{color:var(--red);font-weight:700;text-decoration:underline wavy;text-underline-offset:4px}
.pr-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);background:var(--card)}
.pr-foot-in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.pr-foot-in .btn{flex:1}
.pr-foot-in .btn.ghost{flex:0 0 auto}
.summary{display:grid;gap:14px}
.sum-list{list-style:none;margin:0;padding:0;display:grid}
.sum-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}
.sum-list .w{flex:1;min-width:0;font:600 16.5px/1.25 var(--f-display);overflow-wrap:anywhere}
.delta{font:600 13px/1 var(--f-mono);min-width:6ch;text-align:right}
.delta.up{color:var(--ok)} .delta.down{color:var(--red)} .delta.eq{color:var(--ink-3)}
.thinking{display:inline-flex;align-items:center;gap:10px;color:var(--ink-2);font-size:15px}
.thinking::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--rule-2);border-top-color:var(--pen);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(8,12,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.25);display:grid;gap:14px;align-content:start}
.sheet.full{max-width:860px;height:100%;max-height:none;border-radius:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
@media (min-width:700px){
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{border-radius:16px;max-height:88vh;max-height:88dvh}
  .sheet.full{height:auto;max-height:94vh;max-height:94dvh;border-radius:16px;padding-top:16px}
}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet-head > div{display:grid;gap:4px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:700}
.edit-items{display:grid;gap:10px}
.edit-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--card-2)}
.edit-item .full{grid-column:1 / span 2}
.edit-item.concept{grid-template-columns:minmax(0,1fr) auto}
.edit-item.concept .full{grid-column:1}
@media (max-width:520px){.edit-item{grid-template-columns:minmax(0,1fr) auto}.edit-item > .field:nth-child(2){grid-column:1}.edit-item .full{grid-column:1}}
.drop{display:grid;place-items:center;gap:8px;text-align:center;padding:26px 16px;border:2px dashed var(--rule-2);border-radius:14px;background:var(--card-2);cursor:pointer}
.drop.over{border-color:var(--pen);background:var(--pen-soft)}
.drop input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:10px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (min-width:900px){.toast{bottom:28px}}

/* ---------- listen & chat ---------- */
.listen-grid{display:grid;gap:16px}
@media (min-width:960px){.listen-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.now-card{border:1px solid var(--rule);border-radius:10px;padding:14px;background:var(--card-2);display:grid;gap:6px;min-height:120px}
.now-card .w{font:700 28px/1.1 var(--f-display);overflow-wrap:anywhere}
.now-card .s{font:500 19px/1.35 var(--f-display);overflow-wrap:anywhere}
.now-card .p{color:var(--ink-2);font-size:15px}
.ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.story{display:grid;gap:4px}
.sline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:8px;border:1px solid transparent;text-align:left;background:none;color:var(--ink);width:100%}
.sline:hover{background:var(--card-2)}
.sline.playing{background:var(--pen-soft);border-color:color-mix(in srgb,var(--pen) 35%,transparent)}
.sp{font:600 12px/1.9 var(--f-mono);color:var(--pen);min-width:1.5ch}
.sline .en{font:500 19px/1.45 var(--f-display)}
.sline .pt{display:block;font:400 14.5px/1.4 var(--f-body);color:var(--ink-2);margin-top:2px}
.story.hide-text .en{filter:blur(6px);user-select:none}
.story.hide-pt .pt{display:none}
.defbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--ground);font-weight:700}
@media (min-width:900px){.defbar{bottom:16px}}
.qlist{display:grid;gap:14px}
.q{display:grid;gap:8px}
.q p{font-weight:700}
.chat{display:grid;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;display:grid;gap:6px;font-size:16.5px;line-height:1.45}
.msg.ai{background:var(--card);border:1px solid var(--rule);border-bottom-left-radius:4px;justify-self:start}
.msg.me{background:var(--pen);color:var(--pen-ink);border-bottom-right-radius:4px;justify-self:end}
.msg .row{display:flex;align-items:flex-start;gap:8px}
.msg .row > span{flex:1;min-width:0;overflow-wrap:anywhere}
.fix{justify-self:end;max-width:88%;border-left:3px solid var(--red);padding:6px 10px;font-size:15px;color:var(--ink-2);display:grid;gap:4px;background:var(--card)}
.fix b{color:var(--red)}
.used{justify-self:end;display:flex;flex-wrap:wrap;gap:6px}
.used span{font:600 12px/1 var(--f-mono);padding:5px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.used span.no{background:var(--red-soft);color:var(--red)}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ground);padding:8px 0}
@media (min-width:900px){.composer{bottom:0}}
.composer textarea{min-height:52px;max-height:160px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--rule-2);font:600 14.5px/1.2 var(--f-display);background:var(--card)}
.tchip.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
</style>

<script>
'use strict';
/* ================= utils ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 864e5;
const now = () => Date.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = (n) => String(n).padStart(2, '0');
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const stripMarks = (s) => String(s ?? '').replace(/[⟦⟧]/g, '').replace(/\[\[|\]\]/g, '');
const hl = (s) => esc(s).replace(/⟦([^⟧]*)⟧/g, '<mark class="hl">$1</mark>');
const cap1 = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function slug(s) {
  return String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[⟦⟧]/g, '')
    .replace(/^to\s+/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'item';
}
function norm(s) {
  return String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[’‘`´]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/'/g, '').replace(/\s+/g, ' ').trim();
}
const stripLead = (s) => s.replace(/^(to|a|an|the) /, '');
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = String(iso).split('-').map(Number); if (!m) return ''; return d + ' ' + MONTHS[m - 1] + (y !== new Date().getFullYear() ? ' ' + y : ''); }
function relDays(t) {
  if (!t) return '—';
  const d = Math.round((new Date(dayKey()).getTime() - new Date(dayKey(t)).getTime()) / DAY);
  if (d <= 0) return 'hoje'; if (d === 1) return 'ontem'; return 'há ' + d + ' dias';
}
function inDays(days) { if (days <= 0.5) return 'agora'; if (days < 1.5) return 'amanhã'; return 'em ' + Math.round(days) + ' dias'; }
function lsGet(k, d) { try { const v = localStorage.getItem('fichario:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem('fichario:' + k, JSON.stringify(v)); } catch (e) { /* storage off */ } }
let toastTimer = 0;
function toast(msg, ms = 2600) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

/* ================= icons ================= */
const I = (p, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${p}</svg>`;
const IC = {
  home: I('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M9 3v4M15 3v4"/><circle cx="12" cy="14.5" r="1.7" fill="currentColor" stroke="none"/>'),
  listen: I('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"/>'),
  chat: I('<path d="M5 4.5h14a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-7l-4.5 3.5V17H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/><path d="M7.5 9.5h9M7.5 12.5h6"/>'),
  words: I('<rect x="7" y="7" width="13" height="12" rx="2"/><path d="M4 15.5V6a2 2 0 0 1 2-2h10.5"/><path d="M10 11.5h7M10 15h4.5"/>'),
  lessons: I('<path d="M6.5 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-11z"/><path d="M6.5 3v18M4 7.5h4.5M4 12h4.5M4 16.5h4.5M11 8h5.5"/>'),
  speaker: I('<path d="M4 9.5v5h3.5l4.5 3.8V5.7L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>'),
  play: I('<path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor"/>'),
  pause: I('<rect x="6.5" y="5" width="3.8" height="14" rx="1" fill="currentColor"/><rect x="13.7" y="5" width="3.8" height="14" rx="1" fill="currentColor"/>'),
  prev: I('<path d="M17 6l-7 6 7 6z" fill="currentColor"/><path d="M7 6v12"/>'),
  next: I('<path d="M7 6l7 6-7 6z" fill="currentColor"/><path d="M17 6v12"/>'),
  close: I('<path d="M6 6l12 12M18 6L6 18"/>'),
  back: I('<path d="M15 5l-7 7 7 7"/>'),
  plus: I('<path d="M12 5v14M5 12h14"/>'),
  trash: I('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>'),
  ext: I('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
  send: I('<path d="M4 12l16-8-6 16-2.5-6.5z"/>'),
  file: I('<path d="M14 3H6.5a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h5"/>'),
  spark: I('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'),
};
const sayBtn = (text, cls = '', rate = '') => (TTS.ok ? `<button class="say ${cls}" data-act="say" data-text="${esc(stripMarks(text))}"${rate ? ` data-rate="${rate}"` : ''} aria-label="Ouvir">${IC.speaker}</button>` : '');

/* ================= state ================= */
const APP_VERSION = '2.0.0';
const DEFAULT_SETTINGS = { sessionSize: 15, newPerSession: 8, about: '', autoSpeak: true };
const S = {
  loaded: false, aiBlocked: false,
  lessons: new Map(), tomb: {}, progress: {},
  stats: { d: {} }, settings: { ...DEFAULT_SETTINGS }, ai: {},
  meta: {}, outbox: null,
  items: [], byGid: new Map(), lessonList: [], latest: null, second: null,
  tab: lsGet('tab', 'home'), lessonOpen: null,
  filters: { q: '', lesson: 'all', band: 'all', sort: 'weak' },
  syncing: false, syncAgain: false, syncError: '',
};
const TABS = [
  ['home', 'Hoje', IC.home], ['listen', 'Ouvir', IC.listen], ['chat', 'Conversar', IC.chat],
  ['words', 'Palavras', IC.words], ['lessons', 'Aulas', IC.lessons],
];
const connected = () => !!(S.meta && S.meta.b && S.meta.k);
const aiOn = () => connected() && S.meta.hasKey !== false && !S.aiBlocked;
function aiNotice() {
  if (!connected()) return 'Para usar a IA, conecte o app à sua planilha em Ajustes.';
  if (S.meta.hasKey === false) return 'A chave do Gemini ainda não foi configurada. Na planilha, use o menu Fichário > 2. Configurar chave do Gemini.';
  if (S.aiBlocked) return 'A IA está indisponível agora.';
  return '';
}
const lessonName = (L) => (L && L.num ? 'Aula ' + L.num : (L && L.title) || 'Aula');
const lessonId = (num, date) => (num ? 'L' + String(num).padStart(3, '0') : 'D' + String(date || dayKey()).replace(/-/g, ''));
const splitGid = (gid) => { const k = gid.indexOf(':'); return [gid.slice(0, k), gid.slice(k + 1)]; };

/* ================= reforço engine ================= */
const W = { intro: 0, rec: 10, pro_mc: 12, lis_word: 12, lis_mean: 14, cloze_mc: 12, type: 20, cloze_type: 20, dict_word: 18, dict_sent: 24, use: 28, chat: 16, drill_mc: 12, drill_type: 20, drill_listen: 14 };
const MC = new Set(['rec', 'pro_mc', 'lis_word', 'lis_mean', 'cloze_mc', 'drill_mc', 'drill_listen']);
const MC_CAP = 65;
function retention(p, t = now()) {
  if (!p || !p.lr) return 1;
  const days = Math.max(0, (t - p.lr) / DAY);
  return 1 / (1 + days / (9 * Math.max(0.3, p.st || 0.5)));
}
function reforco(p, t = now()) {
  if (!p || !p.n) return 0;
  return Math.round(clamp((p.s || 0) * (0.35 + 0.65 * retention(p, t)), 0, 100));
}
function bandOf(p, t = now()) {
  if (!p || !p.n) return 'new';
  const r = reforco(p, t);
  return r < 40 ? 'weak' : r < 70 ? 'learn' : r < 85 ? 'near' : 'done';
}
const BANDS = [['new', 'Nova'], ['weak', 'Fraca'], ['learn', 'Aprendendo'], ['near', 'Quase lá'], ['done', 'Dominada']];
const BAND_LABEL = Object.fromEntries(BANDS);
const isNew = (it) => !it.p || !it.p.n;
function isDue(p, t = now()) { if (!p || !p.n) return false; return (t - p.lr) / DAY >= (p.st || 0.5); }
function dueIn(p, t = now()) { if (!p || !p.n) return 0; return (p.st || 0.5) - (t - p.lr) / DAY; }
function applyAnswer(p0, type, q, t = now()) {
  const p = { s: 0, st: 0.5, lr: 0, n: 0, ok: 0, ko: 0, str: 0, ...(p0 || {}) };
  if (type === 'intro') return { ...p, seen: t };
  const base = p.n ? reforco(p, t) : 0;
  const hours = p.n && p.lr ? (t - p.lr) / 3.6e6 : 0;
  const w = W[type] ?? 12;
  let s = base; let st = p.st || 0.5;
  if (q >= 1) {
    const bonus = 1 + Math.min(1, hours / 48) * 0.5;
    s = base + w * (1 - base / 200) * bonus;
    if (MC.has(type)) s = Math.max(base, Math.min(MC_CAP, s));
    if (hours >= 12) st = Math.min(180, Math.max(1, st) * (1.5 + (Math.min(100, s) / 100) * 1.5));
    else st = Math.min(Math.max(st, 1), st + 0.3);
    p.ok += 1; p.str += 1;
  } else if (q > 0) {
    s = base + w * 0.35 * (1 - base / 200);
    if (MC.has(type)) s = Math.max(base, Math.min(MC_CAP, s));
    p.str = 0;
  } else {
    s = Math.max(0, base - (12 + base * 0.3));
    st = Math.max(0.3, st * 0.45);
    p.ko += 1; p.str = 0;

const IDB = {

      let req;

      req.onupgradeneeded = () => { try { req.result.createObjectStore('kv'); } catch (e) { /* exists */ } };

      setTimeout(() => res(IDB.db), 4000);

  get(key) {

      if (!IDB.db) { res(lsGet('kv:' + key, undefined)); return; }

      catch (e) { res(undefined); }

function markCl(i) {
  const ex = i.ex || ''; const cl = i.cl && ex.includes(i.cl) ? i.cl : findCl(i);
  if (!cl) return esc(ex);
  const k = ex.indexOf(cl);
  return esc(ex.slice(0, k)) + '<mark class="hl">' + esc(cl) + '</mark>' + esc(ex.slice(k + cl.length));
}
function findCl(i) {
  const ex = i.ex || ''; if (!ex) return '';
  if (i.cl && ex.includes(i.cl)) return i.cl;
  const cands = answersFor(i).sort((a, b) => b.length - a.length);
  const low = ex.toLowerCase();
  for (const a of cands) {
    const re = new RegExp('\\b' + a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+') + '\\b', 'i');
    const m = low.match(re); if (m) return ex.substr(m.index, m[0].length);
  }
  return '';
}

async function saveEditWord(form) {
  const gid = form.dataset.gid; const i = S.byGid.get(gid); if (!i) return;
  const L = S.lessons.get(i.lid); const v = (k) => $('#ew-' + k).value.trim();
  if (!v('en') || !v('pt')) { toast('Preencha inglês e português.'); return; }
  const items = (L.items || []).map((x) => {
    if (x.id !== i.id) return x;
    const nx = { ...x, en: v('en'), pt: v('pt'), pron: v('pron'), note: v('note'), ex: v('ex'), exPt: v('exPt') };
    const alt = v('alt').split('/').map((s) => s.trim()).filter(Boolean); if (alt.length) nx.alt = alt; else delete nx.alt;
    if (nx.ex && !(nx.cl && nx.ex.includes(nx.cl))) { const c = findCl({ ...nx, cl: '' }); if (c) nx.cl = c; else delete nx.cl; }
    Object.keys(nx).forEach((k) => { if (nx[k] === '') delete nx[k]; });
    return nx;
  });
  try { await saveLesson(i.lid, { ...L, items }); toast('Palavra salva.'); openWord(gid); }
  catch (e) { toast('Não consegui salvar agora. Tente de novo.'); }
}

  const targets = (d.targets || []).map((g) => S.byGid.get(g)).filter(Boolean);
  const usedOk = new Set(); (d.turns || []).forEach((t) => (t.ok || []).forEach((g) => usedOk.add(g)));
  const msgs = (d.turns || []).map((t) => {
    if (t.role === 'assistant') return `<div class="msg ai"><div class="row"><span>${esc(t.content)}</span>${sayBtn(t.content, 'sm')}</div></div>`;
    const ok = (t.ok || []).map((g) => S.byGid.get(g)).filter(Boolean); const bad = (t.bad || []).map((g) => S.byGid.get(g)).filter(Boolean);
    return `<div class="msg me">${esc(t.content)}</div>
      ${t.fix ? `<div class="fix"><span><b>Correção:</b> ${esc(t.fix)} ${sayBtn(t.fix, 'sm')}</span>${t.tip ? `<span>${esc(t.tip)}</span>` : ''}</div>` : ''}
      ${ok.length || bad.length ? `<div class="used">${ok.map((i) => `<span>✓ ${esc(stripMarks(i.en))}</span>`).join('')}${bad.map((i) => `<span class="no">✗ ${esc(stripMarks(i.en))}</span>`).join('')}</div>` : ''}`;
  }).join('');
  return `<div class="panel-head" style="margin-bottom:10px"><div class="chips">${targets.map((i) => `<span class="tchip${usedOk.has(i.gid) ? ' ok' : ''}" title="${esc(i.pt)}">${usedOk.has(i.gid) ? '✓ ' : ''}${hl(i.en)}</span>`).join('')}</div>
      <button class="btn small" data-act="ch-new" ${CH.busy ? 'disabled' : ''}>Nova conversa</button></div>
    <div class="chat" id="chat-log">${msgs}${CH.busy ? '<div class="msg ai"><span class="thinking">Escrevendo…</span></div>' : ''}</div>
    ${CH.err ? `<p class="notice warn" style="margin-top:10px">${esc(CH.err)}</p>` : ''}
    <form class="composer" data-form="chat">
      <textarea class="field" id="chat-in" rows="1" placeholder="Responda em inglês…" aria-label="Sua mensagem" ${CH.busy ? 'disabled' : ''}></textarea>
      <button class="btn primary" type="submit" aria-label="Enviar" ${CH.busy ? 'disabled' : ''} style="min-height:52px">${IC.send}</button>
    </form>`;
}
function renderChatSection(focus) {
  const b = $('#chat-box'); if (!b) return;
  const draft = ($('#chat-in') || {}).value || '';
  b.innerHTML = chatHTML();
  const inp = $('#chat-in'); if (inp) { inp.value = draft; if (focus && !CH.busy && matchMedia('(pointer: fine)').matches) inp.focus({ preventScroll: true }); }
  const log = $('#chat-log'); if (log && log.lastElementChild) log.lastElementChild.scrollIntoView({ block: 'nearest' });
}
function afterChatRender() { const log = $('#chat-log'); if (log && log.lastElementChild) log.lastElementChild.scrollIntoView({ block: 'nearest' }); }
function matchTargets(list, targets) {
  const out = [];
  for (const s of Array.isArray(list) ? list : []) {
    const n = norm(s);
    const hit = targets.find((i) => answersFor(i).includes(n) || answersFor(i).includes(stripLead(n)) || norm(stripMarks(i.en)) === n);
    if (hit && !out.includes(hit.gid)) out.push(hit.gid);
  }
  return out;
}
async function chatSend(text) {
  if (!aiOn() || CH.busy) return;
  let d = S.ai.chat;
  if (!d || !text) {
    const targets = pickTargets('latest', 6);
    if (!targets.length) { toast('Envie uma aula primeiro.'); return; }
    d = { targets: targets.map((i) => i.gid), turns: [], at: now() }; S.ai.chat = d;
  }
  const targets = (d.targets || []).map((g) => S.byGid.get(g)).filter(Boolean);
  const rules = `You are a friendly English conversation partner for a Brazilian adult learner (CEFR A1–A2).${S.settings.about ? '\nAbout him (in Portuguese): ' + S.settings.about : ''}
Goal: help him USE these target words and expressions from his English classes (Portuguese meaning in parentheses):
${targets.map((i) => '- ' + stripMarks(i.en) + ' (' + i.pt + ')').join('\n')}
Rules:
- Write simple, natural American English: short sentences, common words, at most 3 sentences per message.
- Use one or two target words naturally in each message, and end with ONE simple question that invites him to use another target word.
- Talk about everyday life: work, home, family, food, weekend, plans.
- If his last message has mistakes, put the corrected version of his message in "fix" and a very short explanation in Brazilian Portuguese in "tip". If it is correct, leave both empty. Ignore capital letters and final punctuation.
- If he writes in Portuguese, put the English version of what he wanted to say in "fix".
Reply with only a JSON object: {"reply": "...", "fix": "...", "tip": "...", "used_ok": [], "used_wrong": []}
"used_ok" and "used_wrong": the target words (written exactly as in the list) that he used correctly or incorrectly in his LAST message.`;
  if (text) d.turns.push({ role: 'user', content: text.slice(0, 600) });
  const hist = d.turns.slice(-16).map((t) => ({ role: t.role, content: t.role === 'assistant' ? JSON.stringify({ reply: t.content }) : t.content }));
  const input = { system: rules, messages: hist.length ? hist : [{ role: 'user', content: 'Start the conversation now: greet him and ask your first question.' }] };
  CH.busy = true; CH.err = ''; CH.ctl = new AbortController(); renderChatSection();
  try {
    const r = await AI.json(input, { tier: 'quick', signal: CH.ctl.signal });
    const reply = String((r && r.reply) || '').trim(); if (!reply) throw { code: 'invalid_json' };
    if (text) {
      const last = d.turns[d.turns.length - 1];
      last.fix = String(r.fix || '').trim(); last.tip = String(r.tip || '').trim();
      if (norm(last.fix) === norm(last.content)) { last.fix = ''; last.tip = ''; }
      last.ok = matchTargets(r.used_ok, targets); last.bad = matchTargets(r.used_wrong, targets).filter((g) => !last.ok.includes(g));
      for (const g of last.ok) { const it = S.byGid.get(g); if (it) { queueProgress(g, applyAnswer(it.p, 'chat', 1)); bumpStats(true, 0); } }
    }
    d.turns.push({ role: 'assistant', content: reply.slice(0, 800) });
    d.turns = d.turns.slice(-40); d.at = now();
    await saveAi('chat', d);
    CH.busy = false; renderChatSection(true);
    if (TTS.ok && S.settings.autoSpeak !== false) speak(reply);
  } catch (e) {
    CH.busy = false;
    if (!(e && e.code === 'cancelled')) CH.err = aiErrMsg(e);
    renderChatSection();
  }
}
Object.assign(XACT, {

  'pl-prev': () => { if (!PL.list.length) plBuild(); PL.i = (PL.i - 1 + PL.list.length) % Math.max(1, PL.list.length); if (PL.on) { speechStop(); clearTimeout(PL.timer); plStep(); } else plRefresh(); },

  'pl-opt': (el) => { if (el.id === 'pl-pt') { PL.pt = el.checked; lsSet('pl-pt', PL.pt); } else { PL.rep = el.checked; lsSet('pl-rep', PL.rep); } },

  'tx-rate': (el) => { TX.rate = Number(el.dataset.v); lsSet('tx-rate', TX.rate); $$('[data-act="tx-rate"]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === TX.rate))); },
  'tx-show': () => { TX.showText = !TX.showText; renderTextSection(); },

  'tx-def': (el) => { const w = el.dataset.w || el.textContent; const it = findByForm(w); TX.def = it ? `<span style="flex:1"><b>${esc(w)}</b> → ${esc(it.pt)}</span>${sayBtn(w, 'sm')}` : `<span style="flex:1"><b>${esc(w)}</b></span>${sayBtn(w, 'sm')}`; renderTextSection(); speak(w); },
  'tx-q': (el) => { const k = Number(el.dataset.k); if (TX.answers[k] !== undefined) return; TX.answers[k] = Number(el.dataset.j); renderTextSection(); },
  'ch-new': () => { if (CH.ctl) CH.ctl.abort(); S.ai.chat = null; CH.busy = false; chatSend(null); },
});
XFORM.chat = (f) => { const inp = $('#chat-in'); const v = (inp && inp.value || '').trim(); if (!v || CH.busy) return; inp.value = ''; chatSend(v); };
document.addEventListener('keydown', (e) => {
